name: CI - Postgres migrations

on:
  pull_request:

jobs:
  alembic-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: chisos_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chisos_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_ENV: production
      DATABASE_URL: postgresql://postgres@localhost:5432/chisos_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Verify lockfile is in sync
        working-directory: backend
        run: uv lock --check

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Alembic migrations on Postgres
        working-directory: backend
        run: uv run alembic upgrade head

      # Report-only for now: the remaining drift (vector column types and
      # legacy index/constraint naming) needs a dedicated reconciliation pass.
      - name: Report schema drift (non-blocking)
        working-directory: backend
        run: |
          if ! uv run alembic check; then
            echo "::warning::Alembic detected schema drift. Reconcile models and migrations."
          fi
