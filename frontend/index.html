<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chisos - Your Life, Intelligently Organized</title>
    <meta
      name="description"
      content="Voice notes, meal tracking, task management, and a vinyl collection — all powered by AI. Speak it, snap it, or type it. Chisos handles the rest."
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chisos" />

    <!-- Apply the saved theme before first paint so dark mode never flashes light. -->
    <script>
      ;(function () {
        var stored = 'system'
        try {
          stored = localStorage.getItem('chisos-theme') || 'system'
        } catch (e) {}
        if (stored !== 'light' && stored !== 'dark' && stored !== 'system') stored = 'system'

        var systemDark = false
        try {
          systemDark = !!(
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          )
        } catch (e) {}

        var dark = stored === 'dark' || (stored === 'system' && systemDark)
        try {
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#1c1c20' : '#fbfbfd')
        } catch (e) {}
      })()
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
